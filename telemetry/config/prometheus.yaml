global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - service.name
    - service.namespace
    - deployment.environment.name
